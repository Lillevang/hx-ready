# Recipe for Helix's "rust" language.
#
# Helix wants (hx --health rust):
#   language server: rust-analyzer
#   debug adapter:   lldb-dap
#   formatter:       none configured
#
# Fedora's rust-analyzer package pulls in the toolchain it needs (cargo,
# rust-src). lldb-dap ships inside the lldb package.
language: rust
display_name: Rust

requires:
  language_servers:
    - rust-analyzer
  debug_adapters:
    - lldb-dap

fedora:
  packages:
    - name: rust-analyzer
    - name: lldb
      provides: [lldb-dap]

# Ubuntu 24.04 does not package rust-analyzer; it comes from rustup (D-024).
# Initialise rustup only when it has no active toolchain. An existing cargo
# executable may belong to the distro or be an unconfigured rustup proxy.
# Preserve the user's default and project overrides (D-025).
debian:
  packages:
    - name: rustup
    - name: lldb
      # Debian/Ubuntu install only the versioned binary (lldb-dap-18);
      # the plain name Helix wants is created below.
      provides: [lldb]
  commands:
    - provides: [rust-analyzer]
      # A conditional needs the explicit shell form (D-010). Keep setup in
      # this step so a cargo on PATH cannot cause it to be skipped.
      shell: |
        if ! rustup show active-toolchain >/dev/null 2>&1; then
          rustup default stable || exit $?
        fi
        rustup component add rust-analyzer
      needs: [rustup]
    - provides: [lldb-dap]
      # shell form (D-010) because the LLVM version differs per release and
      # a glob is needed to find it. User-level symlink only (D-007).
      shell: mkdir -p "$HOME/.local/bin" && ln -sf "$(ls /usr/lib/llvm-*/bin/lldb-dap | sort -V | tail -1)" "$HOME/.local/bin/lldb-dap"
      needs: [lldb]
