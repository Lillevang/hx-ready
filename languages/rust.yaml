# Recipe for Helix's "rust" language.
#
# Helix wants (hx --health rust):
#   language server: rust-analyzer
#   debug adapter:   lldb-dap
#   formatter:       none configured
#
# Fedora's rust-analyzer package pulls in the toolchain it needs (cargo,
# rust-src). lldb-dap ships inside the lldb package.
language: rust
display_name: Rust

requires:
  language_servers:
    - rust-analyzer
  debug_adapters:
    - lldb-dap

fedora:
  packages:
    - name: rust-analyzer
    - name: lldb
      provides: [lldb-dap]

# Ubuntu 24.04 does not package rust-analyzer; it comes from rustup (D-024).
# "rustup default stable" installs a toolchain and makes it the default,
# which a fresh machine needs before any proxy in ~/.cargo/bin works. It
# only runs when rust-analyzer is missing.
debian:
  packages:
    - name: rustup
    - name: lldb
      # Debian/Ubuntu install only the versioned binary (lldb-dap-18);
      # the plain name Helix wants is created below.
      provides: [lldb]
  commands:
    - provides: [cargo, rustc]
      args: [rustup, default, stable]
      needs: [rustup]
    - provides: [rust-analyzer]
      args: [rustup, component, add, rust-analyzer]
      needs: [rustup, cargo]
    - provides: [lldb-dap]
      # shell form (D-010) because the LLVM version differs per release and
      # a glob is needed to find it. User-level symlink only (D-007).
      shell: mkdir -p "$HOME/.local/bin" && ln -sf "$(ls /usr/lib/llvm-*/bin/lldb-dap | sort -V | tail -1)" "$HOME/.local/bin/lldb-dap"
      needs: [lldb]
