# Recipe for Helix's "rust" language.
#
# Helix wants (hx --health rust):
#   language server: rust-analyzer
#   debug adapter:   lldb-dap
#   formatter:       none configured
#
# Fedora's rust-analyzer package pulls in the toolchain it needs (cargo,
# rust-src). lldb-dap ships inside the lldb package.
language: rust
display_name: Rust

requires:
  language_servers:
    - rust-analyzer
  debug_adapters:
    - lldb-dap

fedora:
  packages:
    - name: rust-analyzer
    - name: lldb
      provides: [lldb-dap]

# No debian block yet: Ubuntu 24.04 does not package rust-analyzer, and the
# alternatives (rustup component, release download) are outside D-016.
# See docs/DECISIONS.md, Q-09.
