name: release

# Tag a commit on main as vX.Y.Z and push the tag. The gate must pass;
# then one tar.gz per target plus SHA256SUMS are attached to a GitHub
# release with generated notes and a build-provenance attestation.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v2
      - run: just gate

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build packages
        env:
          SOURCE_DATE_EPOCH: 0
        run: scripts/release.sh "${GITHUB_REF_NAME}"

      - name: Verify checksums and the host binary
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          tar -xzf "hx-ready_${GITHUB_REF_NAME}_linux_amd64.tar.gz"
          "./hx-ready_${GITHUB_REF_NAME}_linux_amd64/hx-ready" version | grep -F "${GITHUB_REF_NAME}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "hx-ready ${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/SHA256SUMS
